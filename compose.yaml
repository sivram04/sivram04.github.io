services:
  portfolio:
    image: python:3.11-slim
    working_dir: /site
    command: ["python", "/preview/server.py", "--directory", "/site", "--bind", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8765:8080"
    volumes:
      - ./preview_server.py:/preview/server.py:ro
      - ./index.html:/site/index.html:ro
      - ./style.css:/site/style.css:ro
      - ./script.js:/site/script.js:ro
      - ./assets:/site/assets:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
